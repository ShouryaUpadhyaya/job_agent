services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: job_agent_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-job_agent}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-job_agent}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - job_agent_net

  # Express Backend API & Ingestion Engine
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      network: host
    container_name: job_agent_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-job_agent}?schema=public"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GEMINI_KEY: ${GEMINI_KEY:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-http://localhost:3001/api/gmail/oauth2callback}
      GMAIL_INITIAL_LOOKBACK_DAYS: ${GMAIL_INITIAL_LOOKBACK_DAYS:-60}
      GMAIL_SYNC_MAX_MESSAGES: ${GMAIL_SYNC_MAX_MESSAGES:-150}
      GMAIL_AUTO_SYNC: ${GMAIL_AUTO_SYNC:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      DISABLE_SCHEDULER: ${DISABLE_SCHEDULER:-false}
      TZ: Asia/Kolkata
      # The container has no Chrome/display: Wellfound runs go to the host agent
      # (`npm run wellfound:agent:docker` on the host, same WELLFOUND_AGENT_TOKEN in .env).
      WELLFOUND_EXECUTOR: agent
      WELLFOUND_AGENT_URL: ${WELLFOUND_AGENT_URL:-http://host.docker.internal:3002}
      WELLFOUND_AGENT_TOKEN: ${WELLFOUND_AGENT_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    volumes:
      - ./wellfound_autoApply:/app/wellfound_autoApply
      - ./scripts:/app/scripts
      # written by the host agent; read-only here so the container never creates root-owned files
      - ./logs:/app/logs:ro
      - ./diagnostics:/app/diagnostics:ro
    networks:
      - job_agent_net

  # Next.js Frontend Dashboard
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: job_agent_web
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      TZ: Asia/Kolkata
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    networks:
      - job_agent_net

volumes:
  postgres_data:
    driver: local

networks:
  job_agent_net:
    driver: bridge
